services:
  geopulse-studio:
    build: .
    container_name: geopulse-studio
    restart: unless-stopped
    mem_limit: 768m
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET:?Set a private SESSION_SECRET in .env}
      - ADMIN_EMAIL=${ADMIN_EMAIL:?Set the private owner ADMIN_EMAIL in .env}
      - APP_URL=${APP_URL:?Set APP_URL in .env}
      - GEOPULSE_DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: geopulse-caddy
    restart: unless-stopped
    depends_on:
      geopulse-studio:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
