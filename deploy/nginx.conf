# GeoPulse Studio — 生产 Nginx 反向代理配置（适用于阿里云/腾讯云/自有 VPS）
# 使用方式：将 geo.yourdomain.com 替换为你的实际域名，并配合 certbot 配置 HTTPS

server {
    listen 80;
    server_name geo.yourdomain.com;

    # 如已配置 SSL 证书，取消下面注释强制跳转 HTTPS
    # return 301 https://$host$request_uri;

    client_max_body_size 10m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
